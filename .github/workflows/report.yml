# Weekly report (Phase 6): every Monday 5:00 AM IST (Sunday 23:30 UTC), the day after the research.
# Reads GA4, Search Console, imported keyword data and our own tables; Claude Opus 5.5 (effort medium) writes
# what worked and what to do next. The report is in this run's Summary page and in Supabase weekly_reports.
# It changes nothing on the site. Needs these repository secrets:
#   SUPABASE_SECRET_KEY, ANTHROPIC_API_KEY, GSC_SERVICE_ACCOUNT_JSON (also used for GA4),
#   GA4_PROPERTY_ID (the numeric GA4 property ID; without it the report runs on Search Console alone)
name: Weekly report

on:
  schedule:
    - cron: "30 23 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Write the report without saving it"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Write this week's report
        run: npm run report -- ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
