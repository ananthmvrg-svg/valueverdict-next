name: Telegram Channel

# The menu goes out at the daily start time (reels/schedule.json, or the REELS_TIME variable; default 08:00 IST),
# re-posted after each website price re-check (9, 12, 3, 6, 9), 50 deals (every 10th a loot deal) until 22:00 and a top-5 summary
# at 21:30 (variables DEALS_UNTIL, DEALS_PER_DAY, SUMMARY_TIME).
# Needs the TELEGRAM_BOT_TOKEN secret; the bot must be an admin of the channel (post + pin messages).
# Channel: repository variable TELEGRAM_CHANNEL (default @valueverdict).
on:
  schedule:
    - cron: "*/15 * * * *" # a quick check; posts only when the schedule says so
  workflow_dispatch:
    inputs:
      mode:
        description: "menu or deal"
        required: true
        default: "deal"
        type: choice
        options: [deal, menu, auto, summary]
      count:
        description: "Deals to post now (deal mode)"
        required: false
        default: "1"

permissions:
  contents: write # the music inbox step commits removed tracks

concurrency:
  group: telegram-channel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04 # pinned: ffmpeg + Chromium deps are known-good here
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # which products were posted recently, so the channel doesn't repeat itself
      - uses: actions/cache/restore@v4
        with:
          path: reels/channel-state.json
          key: channel-state-${{ github.run_id }}
          restore-keys: channel-state-
      - name: Post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL || '@valueverdict' }}
          MODE: ${{ github.event_name == 'schedule' && 'auto' || inputs.mode }}
          REELS_TIME: ${{ vars.REELS_TIME }}
          DEALS_UNTIL: ${{ vars.DEALS_UNTIL }}
          DEALS_PER_DAY: ${{ vars.DEALS_PER_DAY }}
          SUMMARY_TIME: ${{ vars.SUMMARY_TIME }}
          DEALS_PER_RUN: ${{ inputs.count || '1' }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON channel.mjs --$MODE
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: reels/channel-state.json
          key: channel-state-${{ github.run_id }}
      # "🗑 Remove this track" taps on the reel music in the bot chat (reels/music-inbox.mjs)
      - name: Music removals
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON music-inbox.mjs
          cd ..
          git add -A reels/audio
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reel music: tracks removed from Telegram"
          git pull --rebase -q && git push
