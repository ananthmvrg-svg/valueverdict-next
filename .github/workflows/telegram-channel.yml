name: Telegram Channel

# The menu goes out at the daily start time (reels/schedule.json, or the REELS_TIME variable; default 08:00 IST),
# then one deal every 30 minutes from 30 minutes later until 22:00 (variables DEALS_UNTIL, DEAL_EVERY_MINUTES).
# Needs the TELEGRAM_BOT_TOKEN secret; the bot must be an admin of the channel (post + pin messages).
# Channel: repository variable TELEGRAM_CHANNEL (default @valueverdict).
on:
  schedule:
    - cron: "*/15 * * * *" # a quick check; posts only when the schedule says so
  workflow_dispatch:
    inputs:
      mode:
        description: "menu or deal"
        required: true
        default: "deal"
        type: choice
        options: [deal, menu, auto]
      count:
        description: "Deals to post now (deal mode)"
        required: false
        default: "1"

permissions:
  contents: read

concurrency:
  group: telegram-channel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04 # pinned: ffmpeg + Chromium deps are known-good here
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # which products were posted recently, so the channel doesn't repeat itself
      - uses: actions/cache/restore@v4
        with:
          path: reels/channel-state.json
          key: channel-state-${{ github.run_id }}
          restore-keys: channel-state-
      - name: Post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL || '@valueverdict' }}
          MODE: ${{ github.event_name == 'schedule' && 'auto' || inputs.mode }}
          REELS_TIME: ${{ vars.REELS_TIME }}
          DEALS_UNTIL: ${{ vars.DEALS_UNTIL }}
          DEAL_EVERY_MINUTES: ${{ vars.DEAL_EVERY_MINUTES }}
          DEALS_PER_RUN: ${{ inputs.count || '1' }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON channel.mjs --$MODE
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: reels/channel-state.json
          key: channel-state-${{ github.run_id }}
