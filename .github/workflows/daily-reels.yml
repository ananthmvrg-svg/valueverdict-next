name: Daily Reels

# Runs once a day at the time in reels/schedule.json (default 08:00 IST), and from the GitHub app:
# Actions → Daily Reels → Run workflow. To change the daily time without touching code, set the repository
# variable REELS_TIME (Settings → Secrets and variables → Actions → Variables), e.g. 06:30 (24-hour, India time).
# GitHub wakes this every 15 minutes; a tiny check runs the real job only when today's time has come and
# today's reels haven't been made yet.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Only these category slugs, comma separated (empty = all)"
        required: false
        default: ""
      max_items:
        description: "Products per reel (1-5)"
        required: false
        default: "5"
      season:
        description: "Festival/season for the AI hooks (empty = reels/season.json)"
        required: false
        default: ""
      youtube:
        description: "Upload the best Shorts to YouTube as private"
        type: boolean
        default: true
      shorts:
        description: "How many Shorts to upload"
        required: false
        default: "6"

permissions:
  contents: write # publish the daily ZIP as a release when it's too big for Telegram

jobs:
  when:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
      date: ${{ steps.time.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: reels
      - id: time
        env:
          REELS_TIME: ${{ vars.REELS_TIME }}
        run: node reels/when.mjs reels
      - id: done
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: reels-done.txt
          key: reels-done-${{ steps.time.outputs.date }}
          lookup-only: true
      - id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT";
          elif [ "${{ steps.time.outputs.go }}" = "true" ] && [ "${{ steps.done.outputs.cache-hit }}" != "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT";
          else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  reels:
    needs: when
    if: needs.when.outputs.run == 'true'
    runs-on: ubuntu-24.04 # pinned: ffmpeg + Chromium deps are known-good here
    timeout-minutes: 30
    defaults:
      run:
        working-directory: reels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg zip
      - name: Install packages
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Generate reels and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # AI hooks; without it the reels use plain lines
          SEASON: ${{ github.event.inputs.season }}
          ONLY: ${{ github.event.inputs.only }}
          MAX_ITEMS: ${{ github.event.inputs.max_items || '5' }}
          GH_TOKEN: ${{ github.token }}
        run: npm run generate
      - name: Upload best Shorts to YouTube (private)
        if: success() && github.event.inputs.youtube != 'false'
        continue-on-error: true # a YouTube problem never blocks the reels ZIP
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_SHORTS_PER_DAY: ${{ github.event.inputs.shorts || '6' }}
          SEASON: ${{ github.event.inputs.season }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON youtube.mjs
      # mark today as done (scheduled runs only), so the 15-minute check doesn't make them again
      - name: Mark today done
        if: always() && github.event_name == 'schedule'
        run: echo done > ../reels-done.txt
      - uses: actions/cache/save@v4
        if: always() && github.event_name == 'schedule'
        with:
          path: reels-done.txt
          key: reels-done-${{ needs.when.outputs.date }}
      - name: Keep the ZIP on the run page (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reels-kit
          path: reels/out/*.zip
          retention-days: 7
          if-no-files-found: ignore
